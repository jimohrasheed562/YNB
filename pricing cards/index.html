<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Card</title>
    <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="content">
        <h2>Regular</h2>
        <p>$100/month</p>
        <p>Basic features and support.</p>
      </div>
      <button class="button">Select Plan</button>
    </div>
    <div class="card">
      <div class="content">
        <h2>Premium</h2>
        <p>$150/month</p>
        <p>Advanced features, priority support, and more.</p>
      </div>
      <button class="button">Select Plan</button>
    </div>
    <div class="card">
      <div class="content">
        <h2>Super Premium</h2>
        <p>$250/month</p>
        <p>Premium features, 24/7 support, and extras.</p>
      </div>
      <button class="button">Select Plan</button>
    </div>
  </div>
</body>
</html>
